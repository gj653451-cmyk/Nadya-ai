<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nadya AI - Msaidizi Wako</title>
    <style>
        :root {
            --bg-color: #131314;
            --chat-bg: #1e1f20;
            --text-color: #e3e3e3;
            --accent-color: #8ab4f8;
            --input-bg: #2d2e30;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            padding: 15px 20px;
            background-color: var(--chat-bg);
            border-bottom: 1px solid #3c4043;
            font-size: 1.2rem;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }
        .message {
            padding: 12px 18px;
            border-radius: 12px;
            max-width: 75%;
            line-height: 1.5;
        }
        .user-message {
            background-color: #2b3137;
            align-self: flex-end;
        }
        .ai-message {
            background-color: var(--chat-bg);
            align-self: flex-start;
            border: 1px solid #3c4043;
        }
        .input-area {
            padding: 20px;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
        }
        .input-wrapper {
            display: flex;
            width: 100%;
            max-width: 800px;
            background-color: var(--input-bg);
            border-radius: 24px;
            padding: 8px 15px;
            align-items: center;
            border: 1px solid #5f6368;
        }
        input[type="text"] {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
            padding: 8px;
        }
        button {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 18px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            opacity: 0.9;
        }
        .toolbar {
            display: flex;
            gap: 10px;
            padding: 0 20px 10px 20px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }
        .tool-btn {
            background: var(--chat-bg);
            color: var(--text-color);
            border: 1px solid #3c4043;
            font-size: 0.85rem;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <span>Nadya AI</span>
        <span style="font-size: 0.8rem; color: #9aa0a6;">Powered by Google Brain</span>
    </header>

    <div class="chat-container" id="chatContainer">
        <div class="message ai-message">Mambo! Mimi ni Nadya, rafiki yako wa AI. Nipo tayari kukusaidia kupiga stori, kutengeneza picha, video, au kufanya kazi zako. Nikusaidie nini leo?</div>
    </div>

    <div class="toolbar">
        <button class="tool-btn" onclick="quickAction('Tengeneza picha ya...')">🖼️ Tengeneza Picha</button>
        <button class="tool-btn" onclick="quickAction('Unda video ya...')">🎥 Tengeneza Video</button>
        <button class="tool-btn" onclick="quickAction('Kumbuka hili...')">🧠 Hifadhi Kumbukumbu</button>
    </div>

    <div class="input-area">
        <div class="input-wrapper">
            <input type="text" id="userInput" placeholder="Uliza Nadya chochote..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Tuma</button>
        </div>
    </div>

    <script>
        function sendMessage() {
            const input = document.getElementById('userInput');
            const container = document.getElementById('chatContainer');
            const text = input.value.trim();

            if (!text) return;

            // Ujumbe wa mtumiaji
            const userDiv = document.createElement('div');
            userDiv.className = 'message user-message';
            userDiv.textContent = text;
            container.appendChild(userDiv);

            input.value = '';
            container.scrollTop = container.scrollHeight;

            // Majibu ya Nadya (Awamu ya mfano/simulator kabla ya kuunganisha API kamili)
            setTimeout(() => {
                const aiDiv = document.createElement('div');
                aiDiv.className = 'message ai-message';
                aiDiv.textContent = "Nimeipokea na ninaifanyia kazi: \"" + text + "\". (Niko tayari kuunganishwa na mfumo wa Google API kutekeleza hili kikamilifu!)";
                container.appendChild(aiDiv);
                container.scrollTop = container.scrollHeight;
            }, 1000);
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }

        function quickAction(actionText) {
            document.getElementById('userInput').value = actionText;
            document.getElementById('userInput').focus();
        }
    </script>
</body>
</html>
